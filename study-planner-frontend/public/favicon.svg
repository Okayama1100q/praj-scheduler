<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Carbon circular frame with neon glow border -->
  <circle cx="256" cy="256" r="240" fill="#131810" />
  <circle cx="256" cy="256" r="230" stroke="#CCFF00" stroke-width="12" stroke-opacity="0.2" />
  <circle cx="256" cy="256" r="220" stroke="#CCFF00" stroke-width="8" />

  <!-- High-velocity electric charging lightning bolt + racing flags motif -->
  <g transform="translate(12, 12)">
    <!-- Fast Lightning bolt in Electric Lime -->
    <path d="M280 60 L120 260 H240 L200 420 L360 220 H240 Z" fill="#CCFF00" filter="drop-shadow(0 0 16px rgba(204,255,0,0.6))" />
    
    <!-- White wind speed stripes crossing behind the bolt -->
    <path d="M90 160 H180" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.3" />
    <path d="M70 220 H150" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.4" />
    <path d="M310 260 H400" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.3" />
    <path d="M330 320 H410" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.4" />
  </g>
</svg>